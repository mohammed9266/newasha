<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>لوحة التحكم المباشرة | متوافقة مع الجوال</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] },
          screens: {
            'xs': '420px',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    /* منع الـ Zoom التلقائي في مدخلات iPhone */
    input, select, textarea {
      font-size: 16px !important;
    }
    /* تخصيص شريط التمرير */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-teal-500 selection:text-white pb-20 sm:pb-8">

  <!-- ======================== رابط الـ API ======================== -->
  <script>
    // ضع رابط الـ Web App الخاص بك هنا:
    const SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbw8hwwicaPoayJLSEmfYm3-dvRRPUxhjhAjsRdJWYLI35rWXYdI9Oflp-wEMgJpuS45Qw/exec";
  </script>

  <!-- ======================== Header ======================== -->
  <header class="border-b border-slate-800 bg-slate-900/95 backdrop-blur-md sticky top-0 z-40 px-4 py-3 sm:py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      
      <!-- العنوان والأيقونة -->
      <div class="flex items-center space-x-2.5 space-x-reverse min-w-0">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex-shrink-0 flex items-center justify-center shadow-md shadow-teal-500/20">
          <svg class="w-5 h-5 sm:w-6 sm:h-6 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        </div>
        <div class="truncate">
          <h1 class="text-sm sm:text-base font-bold tracking-wide truncate">لوحة التحكم التفاعلية</h1>
          <p class="text-[11px] text-slate-400 truncate" id="sheet-title-display">جاري الاتصال...</p>
        </div>
      </div>

      <!-- عناصر التحكم والحالة -->
      <div class="flex items-center space-x-2 space-x-reverse flex-shrink-0">
        <!-- مؤشر الحالة -->
        <div class="flex items-center space-x-1.5 space-x-reverse text-xs px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="status-dot"></span>
          <span id="status-text" class="hidden sm:inline text-slate-300">مزامنة...</span>
        </div>

        <!-- زر التحديث -->
        <button onclick="fetchData()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 active:scale-95 transition-transform" title="تحديث">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" id="refresh-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>

        <!-- زر الإضافة (يختفي على شاشات الجوال الصغيرة ويتحول لزر عائم أسفل الشاشة) -->
        <button onclick="openModal('create')" class="hidden sm:flex items-center space-x-1.5 space-x-reverse bg-teal-600 hover:bg-teal-500 text-white text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-lg shadow-md transition-all active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          <span>إضافة سجل</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ======================== المحتوى الرئيسي ======================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-4 sm:space-y-6">

    <!-- كروت الإحصائيات (Grid مرن يتكيف: عمودين للجوال، 4 أعمدة للتابلت والكمبيوتر) -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-4">
      <div class="bg-slate-800/70 border border-slate-700/60 p-3.5 sm:p-4 rounded-xl">
        <div class="text-[11px] sm:text-xs font-medium text-slate-400 mb-0.5">السجلات</div>
        <div class="text-xl sm:text-2xl font-extrabold text-white" id="kpi-total-rows">0</div>
        <div class="text-[10px] sm:text-xs text-slate-500 mt-1">سجل متاح</div>
      </div>

      <div class="bg-slate-800/70 border border-slate-700/60 p-3.5 sm:p-4 rounded-xl">
        <div class="text-[11px] sm:text-xs font-medium text-slate-400 mb-0.5">المبلغ الإجمالي</div>
        <div class="text-xl sm:text-2xl font-extrabold text-emerald-400 truncate" id="kpi-total-amount">0</div>
        <div class="text-[10px] sm:text-xs text-slate-500 mt-1">ريال</div>
      </div>

      <div class="bg-slate-800/70 border border-slate-700/60 p-3.5 sm:p-4 rounded-xl">
        <div class="text-[11px] sm:text-xs font-medium text-slate-400 mb-0.5">الأعمدة</div>
        <div class="text-xl sm:text-2xl font-extrabold text-indigo-400" id="kpi-total-columns">0</div>
        <div class="text-[10px] sm:text-xs text-slate-500 mt-1">حقول بيانات</div>
      </div>

      <div class="bg-slate-800/70 border border-slate-700/60 p-3.5 sm:p-4 rounded-xl">
        <div class="text-[11px] sm:text-xs font-medium text-slate-400 mb-0.5">آخر مزامنة</div>
        <div class="text-sm sm:text-lg font-bold text-slate-200 mt-1 truncate" id="kpi-last-sync">--:--</div>
        <div class="text-[10px] text-teal-400 mt-1">تحديث دوري</div>
      </div>
    </div>

    <!-- شريط البحث والفرز والتبديل السريع -->
    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
      <div class="relative flex-1">
        <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input type="text" id="search-input" oninput="applyFilters()" placeholder="بحث سريع في كافة الحقول..." class="w-full pr-9 pl-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-teal-500" />
      </div>

      <div class="flex items-center justify-between sm:justify-end gap-3 text-xs text-slate-400">
        <span>عرض: <strong class="text-teal-400" id="showing-count">0</strong> من <strong class="text-slate-200" id="total-count">0</strong></span>
        
        <!-- زر التبديل بين عرض البطاقات وعرض الجدول (للأجهزة اللوحية والمحمولة) -->
        <button onclick="toggleViewMode()" id="btn-toggle-view" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 flex items-center space-x-1 space-x-reverse">
          <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
          </svg>
          <span id="toggle-view-text">تبديل العرض</span>
        </button>
      </div>
    </div>

    <!-- 1. عرض الجوال (Cards View): يظهر تلقائياً في الشاشات الصغيرة -->
    <div id="mobile-cards-container" class="space-y-3 block md:hidden">
      <!-- يتم حقن البطاقات تلقائياً بواسطة JS -->
    </div>

    <!-- 2. عرض التابلت والشاشات الكبيرة (Table View): يدعم التمرير الأفقي بسلاسة -->
    <div id="table-container" class="hidden md:block bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto min-h-[300px]">
        <table class="w-full text-sm text-right">
          <thead class="bg-slate-800/80 text-xs font-bold text-slate-400 uppercase border-b border-slate-800 sticky top-0" id="table-head">
          </thead>
          <tbody class="divide-y divide-slate-800/60" id="table-body">
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- زر إضافة عائم مخصص للجوال (FAB) يسهل الوصول إليه بإبهام اليد -->
  <button onclick="openModal('create')" class="sm:hidden fixed bottom-5 left-5 z-40 w-13 h-13 p-3.5 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-full shadow-2xl shadow-teal-500/50 flex items-center justify-center active:scale-90 transition-transform">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
    </svg>
  </button>

  <!-- ======================== Modal التعديل والإضافة ======================== -->
  <div id="item-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <!-- نافذة تنزلق من الأسفل على الجوال (Bottom Sheet) وتتوسط الشاشة على التابلت -->
    <div class="bg-slate-900 border border-slate-800 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-200">
      
      <!-- رأس النافذة -->
      <div class="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
        <h3 class="text-sm sm:text-base font-bold text-white" id="modal-title">إضافة سجل جديد</h3>
        <button onclick="closeModal()" class="p-1 rounded-lg text-slate-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- حقول الإدخال -->
      <form id="record-form" onsubmit="handleFormSubmit(event)" class="p-5 overflow-y-auto space-y-3.5 flex-1">
        <input type="hidden" id="form-row-index" value="" />
        <div id="dynamic-form-fields" class="space-y-3"></div>
        <div id="form-error-alert" class="hidden p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs"></div>

        <!-- أزرار الحفظ والإلغاء -->
        <div class="pt-3 border-t border-slate-800 flex items-center justify-end space-x-2 space-x-reverse">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs sm:text-sm font-medium">إلغاء</button>
          <button type="submit" id="btn-save-record" class="px-5 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-white text-xs sm:text-sm font-semibold flex items-center space-x-1.5 space-x-reverse">
            <span id="btn-save-text">حفظ</span>
            <svg id="btn-save-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- حاوية الإشعارات (Toast) -->
  <div id="toast-container" class="fixed top-4 left-4 right-4 sm:right-auto sm:left-5 z-50 space-y-2 pointer-events-none"></div>

  <!-- ======================== كود الجافاسكربت ======================== -->
  <script>
    let state = {
      headers: [],
      rawRows: [],
      filteredRows: [],
      currentSort: { col: null, asc: true },
      isSyncing: false,
      sheetName: "",
      forceViewMode: null // 'cards' أو 'table'
    };

    window.addEventListener('DOMContentLoaded', () => {
      fetchData();
      setInterval(() => { if (!state.isSyncing) fetchData(true); }, 60000);
    });

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-teal-600';

      toast.className = `${bg} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-medium transition-all duration-300 transform -translate-y-2 opacity-0 pointer-events-auto`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => toast.classList.remove('-translate-y-2', 'opacity-0'), 20);
      setTimeout(() => {
        toast.classList.add('-translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function setStatus(text, dotColor) {
      document.getElementById('status-text').textContent = text;
      document.getElementById('status-dot').className = `w-2 h-2 rounded-full ${dotColor}`;
    }

    async function fetchData(isBg = false) {
      if (!SCRIPT_API_URL || SCRIPT_API_URL.includes("YOUR_APPS_SCRIPT")) {
        setStatus("ضع رابط API", "bg-rose-500");
        showToast("يرجى إدخال رابط Apps Script Web App في الكود", "error");
        return;
      }

      state.isSyncing = true;
      if (!isBg) document.getElementById('refresh-icon').classList.add('animate-spin');
      setStatus("مزامنة...", "bg-amber-400 animate-pulse");

      try {
        const res = await fetch(SCRIPT_API_URL);
        const data = await res.json();

        if (data.status === "success") {
          state.headers = data.headers || [];
          state.rawRows = data.rows || [];
          state.sheetName = data.sheetName || "";

          document.getElementById('sheet-title-display').textContent = `الورقة: ${state.sheetName}`;
          updateKpis();
          applyFilters();
          setStatus("متصل", "bg-emerald-400");
          document.getElementById('kpi-last-sync').textContent = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
        } else {
          throw new Error(data.message);
        }
      } catch (err) {
        setStatus("غير متصل", "bg-rose-500");
        showToast(`خطأ في الاتصال: ${err.message}`, "error");
      } finally {
        state.isSyncing = false;
        document.getElementById('refresh-icon').classList.remove('animate-spin');
      }
    }

    function updateKpis() {
      document.getElementById('kpi-total-rows').textContent = state.rawRows.length;
      document.getElementById('kpi-total-columns').textContent = state.headers.length;

      let sum = 0;
      state.rawRows.forEach(row => {
        for (const [k, v] of Object.entries(row)) {
          if (k.includes('مبلغ') || k.includes('سعر') || k.includes('المبلغ')) {
            const n = parseFloat(v);
            if (!isNaN(n)) sum += n;
          }
        }
      });
      document.getElementById('kpi-total-amount').textContent = sum.toLocaleString('ar-SA');
    }

    function applyFilters() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      if (!q) {
        state.filteredRows = [...state.rawRows];
      } else {
        state.filteredRows = state.rawRows.filter(row => 
          Object.entries(row).some(([k, v]) => !k.startsWith('_') && String(v).toLowerCase().includes(q))
        );
      }
      renderViews();
      document.getElementById('showing-count').textContent = state.filteredRows.length;
      document.getElementById('total-count').textContent = state.rawRows.length;
    }

    function renderViews() {
      renderCardsView();
      renderTableView();
    }

    // عرض بطاقات الجوال (Cards View)
    function renderCardsView() {
      const container = document.getElementById('mobile-cards-container');
      if (state.filteredRows.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs bg-slate-900 rounded-xl border border-slate-800">لا توجد سجلات مطابقة</div>`;
        return;
      }

      let html = '';
      state.filteredRows.forEach(row => {
        const rowJson = encodeURIComponent(JSON.stringify(row));
        html += `
          <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-3.5 shadow-sm space-y-2.5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <span class="text-xs font-bold text-teal-400">سجل رقم #${row._rowIndex}</span>
              <div class="flex items-center space-x-1.5 space-x-reverse">
                <button onclick="openEditModal('${rowJson}')" class="px-2.5 py-1 bg-teal-500/10 text-teal-400 rounded-md text-xs">تعديل</button>
                <button onclick="confirmDelete(${row._rowIndex})" class="px-2.5 py-1 bg-rose-500/10 text-rose-400 rounded-md text-xs">حذف</button>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs">
        `;

        state.headers.forEach(h => {
          const val = row[h] !== undefined && row[h] !== "" ? row[h] : "-";
          html += `
            <div class="bg-slate-800/50 p-2 rounded-lg">
              <span class="text-[10px] text-slate-400 block">${h}</span>
              <span class="font-medium text-slate-200 break-words">${val}</span>
            </div>
          `;
        });

        html += `</div></div>`;
      });
      container.innerHTML = html;
    }

    // عرض جدول التابلت والكمبيوتر (Table View)
    function renderTableView() {
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');

      let headHtml = `<tr>`;
      state.headers.forEach(h => {
        headHtml += `<th class="px-3.5 py-3 text-slate-300 font-semibold whitespace-nowrap">${h}</th>`;
      });
      headHtml += `<th class="px-3.5 py-3 text-center text-slate-300 sticky left-0 bg-slate-800">الإجراءات</th></tr>`;
      thead.innerHTML = headHtml;

      if (state.filteredRows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="100" class="text-center py-8 text-slate-500">لا توجد بيانات</td></tr>`;
        return;
      }

      let bodyHtml = '';
      state.filteredRows.forEach(row => {
        const rowJson = encodeURIComponent(JSON.stringify(row));
        bodyHtml += `<tr class="hover:bg-slate-800/40">`;
        state.headers.forEach(h => {
          bodyHtml += `<td class="px-3.5 py-2.5 whitespace-nowrap text-slate-200">${row[h] || '-'}</td>`;
        });
        bodyHtml += `
          <td class="px-3.5 py-2.5 text-center sticky left-0 bg-slate-900/90 whitespace-nowrap">
            <button onclick="openEditModal('${rowJson}')" class="text-teal-400 hover:text-teal-300 text-xs px-2 py-1">تعديل</button>
            <button onclick="confirmDelete(${row._rowIndex})" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1">حذف</button>
          </td>
        </tr>`;
      });
      tbody.innerHTML = bodyHtml;
    }

    // زر التبديل اليدوي بين نمط الجدول والبطاقات
    function toggleViewMode() {
      const cards = document.getElementById('mobile-cards-container');
      const table = document.getElementById('table-container');

      if (cards.classList.contains('hidden')) {
        cards.classList.remove('hidden');
        table.classList.add('hidden');
      } else {
        cards.classList.add('hidden');
        table.classList.remove('hidden');
      }
    }

    // النوافذ المنبثقة (Modal)
    function openModal(mode = 'create', data = null) {
      const modal = document.getElementById('item-modal');
      const title = document.getElementById('modal-title');
      const fields = document.getElementById('dynamic-form-fields');
      document.getElementById('form-error-alert').classList.add('hidden');
      fields.innerHTML = '';

      if (mode === 'create') {
        title.textContent = 'إضافة سجل جديد';
        document.getElementById('form-row-index').value = '';
        state.headers.forEach(h => {
          if (h.toLowerCase() === 'م' || h.toLowerCase() === 'id') return;
          fields.innerHTML += `
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">${h}</label>
              <input type="text" name="${h}" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-teal-500" />
            </div>`;
        });
      } else {
        title.textContent = `تعديل السجل (صف ${data._rowIndex})`;
        document.getElementById('form-row-index').value = data._rowIndex;
        state.headers.forEach(h => {
          fields.innerHTML += `
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">${h}</label>
              <input type="text" name="${h}" value="${data[h] || ''}" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-teal-500" />
            </div>`;
        });
      }
      modal.classList.remove('hidden');
    }

    function openEditModal(jsonStr) {
      openModal('edit', JSON.parse(decodeURIComponent(jsonStr)));
    }

    function closeModal() {
      document.getElementById('item-modal').classList.add('hidden');
    }

    // حفظ البيانات
    async function handleFormSubmit(e) {
      e.preventDefault();
      const rowIndex = document.getElementById('form-row-index').value;
      const formData = new FormData(document.getElementById('record-form'));
      const payloadData = {};
      let hasVal = false;

      formData.forEach((v, k) => {
        payloadData[k] = v.trim();
        if (v.trim() !== '') hasVal = true;
      });

      if (!hasVal) {
        const err = document.getElementById('form-error-alert');
        err.textContent = 'يرجى تعبئة حقل واحد على الأقل.';
        err.classList.remove('hidden');
        return;
      }

      const btnSave = document.getElementById('btn-save-record');
      const btnText = document.getElementById('btn-save-text');
      const spinner = document.getElementById('btn-save-spinner');
      btnSave.disabled = true;
      spinner.classList.remove('hidden');
      btnText.textContent = 'جاري الحفظ...';

      try {
        const res = await fetch(SCRIPT_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: rowIndex ? 'UPDATE' : 'INSERT',
            rowIndex: rowIndex ? parseInt(rowIndex, 10) : undefined,
            data: payloadData,
            sheet: state.sheetName
          })
        });

        const resData = await res.json();
        if (resData.status === 'success') {
          showToast('تم الحفظ بنجاح', 'success');
          closeModal();
          fetchData(false);
        } else {
          throw new Error(resData.message);
        }
      } catch (err) {
        showToast(`فشل الحفظ: ${err.message}`, 'error');
      } finally {
        btnSave.disabled = false;
        spinner.classList.add('hidden');
        btnText.textContent = 'حفظ';
      }
    }

    // حذف سجل
    async function confirmDelete(rowIndex) {
      if (!confirm(`هل أنت متأكد من حذف السجل رقم #${rowIndex}؟`)) return;
      try {
        const res = await fetch(SCRIPT_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'DELETE', rowIndex, sheet: state.sheetName })
        });
        const resData = await res.json();
        if (resData.status === 'success') {
          showToast('تم حذف السجل', 'success');
          fetchData(false);
        } else {
          throw new Error(resData.message);
        }
      } catch (err) {
        showToast(`فشل الحذف: ${err.message}`, 'error');
      }
    }
  </script>
</body>
</html>
