<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner Group Expense Tracker Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 16px; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; }

    /* رأس الصفحة */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 24px; font-weight: 800; color: #fff; }
    .btn-refresh { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--primary); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }

    /* بطاقات الملخص العلوية */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; text-align: center; }
    .stat-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .stat-value { font-size: 26px; font-weight: 800; color: var(--text-main); }
    .stat-value.highlight { color: var(--primary); }

    /* شبكة بطاقات الأعضاء الـ 11 */
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: #e2e8f0; display: flex; align-items: center; gap: 8px; }
    .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .member-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; position: relative; }
    .member-name { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .member-debt { font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 6px; }
    .member-status { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    .status-paid { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .status-debt { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

    /* الجدول السفلي */
    .table-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; min-width: 600px; }
    th { background: #0f172a; color: var(--text-muted); padding: 12px 8px; font-weight: 700; border-bottom: 1px solid var(--card-border); }
    td { padding: 12px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    /* نموذج إضافة عشاء جديد سريع من الجوال */
    .form-card { background: #162032; border: 1px dashed #38bdf8; border-radius: 14px; padding: 18px; margin-bottom: 24px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
    input, select, button { padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg); color: #fff; font-size: 13px; }
    .btn-submit { background: var(--primary); color: #0f172a; font-weight: 800; cursor: pointer; border: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div>
      <h1>لوحة متابعة قطة العشيان</h1>
      <p style="font-size: 13px; color: var(--text-muted);">Dinner Group Expense Tracker</p>
    </div>
    <button class="btn-refresh" onclick="fetchData()">🔄 تحديث البيانات</button>
  </div>

  <!-- Summary Cards -->
  <div class="summary-grid">
    <div class="stat-card">
      <div class="stat-title">عدد الأعضاء</div>
      <div class="stat-value" id="membersCount">11</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">إجمالي تكاليف العشيان</div>
      <div class="stat-value highlight" id="totalExpenses">0 ر.س</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">إجمالي المديونيات المتبقية</div>
      <div class="stat-value" id="totalDebts" style="color: var(--success);">0 ر.س</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">عدد العشيان المسجلة</div>
      <div class="stat-value" id="mealsCount">0</div>
    </div>
  </div>

  <!-- بطاقات الأعضاء الـ 11 وحالتهم المالية -->
  <div class="section-title">👥 حالة الأعضاء والمديونيات</div>
  <div class="members-grid" id="membersContainer">
    <!-- يتم إنشاؤها تلقائياً -->
  </div>

  <!-- جدول تسجيل وتفاصيل العشيان -->
  <div class="section-title">📋 سجل وجبات العشاء وتفاصيل التكلفة</div>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>م</th>
          <th>المصوت</th>
          <th>التاريخ</th>
          <th>الدجاج</th>
          <th>المبلغ</th>
        </tr>
      </thead>
      <tbody id="mealsTableBody">
        <tr><td colspan="5" style="color: var(--text-muted); padding: 20px;">جاري تحميل البيانات من الجدول...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // قائمة الأعضاء الـ 11 المسجلين في جدولك
  const memberNames = [
    "سليمان", "حامد", "الساير", "عبدالرحمن", "علي", 
    "سلمان", "الجاسر", "محمد", "حسين", "مشعل", "خالد"
  ];

  // رابط تصدير بيانات صفحة (m9 أو عشيان يوليو) بصيغة CSV مباشرة بدون تعقيد
  const CSV_URL = "https://docs.google.com/spreadsheets/d/1-rFMRDa9R95g9UNscJDgNIfU7K6Uw-fKiG5jor_aU-c/gviz/tq?tqx=out:csv&sheet=عشيان%20يوليو";

  async function fetchData() {
    try {
      const res = await fetch(CSV_URL);
      const text = await res.text();
      parseAndRender(text);
    } catch (e) {
      console.error(e);
      document.getElementById('mealsTableBody').innerHTML = `<tr><td colspan="5" style="color: var(--danger);">تعذر جلب البيانات. تأكد أن خيار المشاركة في الجدول هو (أي شخص لديه الرابط - Anyone with link).</td></tr>`;
    }
  }

  function parseAndRender(csvText) {
    const lines = csvText.split('\n').map(r => r.split(',').map(c => c.replace(/^"|"$/g, '').trim()));
    
    // تصفية صفوف العشيان الفعلية (التي تبدأ برقم تسلسلي من 1 إلى 20)
    const mealRows = lines.filter(r => !isNaN(parseInt(r[0])) && parseInt(r[0]) > 0 && parseInt(r[0]) <= 25 && r[1]);

    let totalCost = 0;
    const tableBody = document.getElementById('mealsTableBody');
    tableBody.innerHTML = '';

    mealRows.forEach(r => {
      const cost = parseFloat(r[4]) || 0;
      totalCost += cost;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r[0]}</td>
        <td><strong>${r[1]}</strong></td>
        <td>${r[2] || '-'}</td>
        <td>${r[3] || '-'}</td>
        <td style="color: var(--primary); font-weight: bold;">${r[4] || 0} ر.س</td>
      `;
      tableBody.appendChild(tr);
    });

    // تحديث بطاقات الملخص
    document.getElementById('mealsCount').innerText = mealRows.length;
    document.getElementById('totalExpenses').innerText = totalCost.toLocaleString() + ' ر.س';

    // قراءة صف مجموع مديونية كل شخص (الصف 24 في جدولك)
    const debtRow = lines.find(r => r.some(c => c.includes('مجموع مديونية')));
    let debtsTotal = 0;

    const membersContainer = document.getElementById('membersContainer');
    membersContainer.innerHTML = '';

    memberNames.forEach((name, idx) => {
      let debt = 0;
      if (debtRow && debtRow[5 + idx]) {
        debt = parseFloat(debtRow[5 + idx]) || 0;
      }
      debtsTotal += debt;

      const card = document.createElement('div');
      card.className = 'member-card';
      card.innerHTML = `
        <div class="member-name">${name}</div>
        <div class="member-debt">
          <span>المديونية:</span>
          <span style="font-weight: bold; color: ${debt > 0 ? 'var(--danger)' : 'var(--text-muted)'}">${debt} ر.س</span>
        </div>
        <span class="member-status ${debt > 0 ? 'status-debt' : 'status-paid'}">
          ${debt > 0 ? 'متبقي عليه مبلغ' : 'مسدد بالكامل ✓'}
        </span>
      `;
      membersContainer.appendChild(card);
    });

    document.getElementById('totalDebts').innerText = debtsTotal + ' ر.س';
    document.getElementById('totalDebts').style.color = debtsTotal > 0 ? 'var(--danger)' : 'var(--success)';
  }

  // تحميل البيانات تلقائياً عند فتح الصفحة
  fetchData();
</script>

</body>
</html>
